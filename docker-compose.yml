name: project-phantom

services:
  phantom:
    build:
      context: .
      target: demo
    image: project-phantom:demo
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHANTOM_PORT:-8000}:8000"
    environment:
      PHANTOM_CONFIG: /app/configs/realtime_demo.yaml
      PHANTOM_LOG_LEVEL: ${PHANTOM_LOG_LEVEL:-INFO}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
