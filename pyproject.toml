[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "project-phantom"
version = "0.2.0"
description = "Privacy-preserving multimodal affect-aware interaction research prototype"
# Python 3.10-3.13 are supported. Python 3.14 is excluded because several
# pretrained media dependencies do not yet provide a compatible stack.
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Project PHANTOM contributors" },
]
keywords = [
  "affective-computing",
  "human-computer-interaction",
  "multimodal",
  "privacy",
  "responsible-ai",
  "robotics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.30,<1",
]
demo = [
  "httpx>=0.27,<1",
  "streamlit>=1.39,<2",
]
realtime = [
  "deepface>=0.0.95,<1",
  "faster-whisper>=1.1,<2",
  "opencv-python>=4.10,<5",
  "piper-tts==1.6.0",
  "pyttsx3>=2.98,<3",
  "python-dotenv>=1.0,<2",
  "torch>=2.4,<3",
  "transformers>=4.48,<6",
]
audio-ml = [
  "setuptools>=83",
  "torch>=2.4,<3",
]
ml = [
  "librosa>=0.10.2,<1",
  "mediapipe>=0.10.14,<1; python_version < '3.13'",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.12,<2",
  "setuptools>=83",
  "soundfile>=0.12,<1",
  "torch>=2.4,<3",
  "torchaudio>=2.4,<3",
  "transformers>=4.44,<6",
]
dev = [
  "bandit[toml]>=1.8,<2",
  "httpx>=0.27,<1",
  "httpx2>=2.7,<3",
  "mypy>=1.11,<3",
  "pip-audit>=2.7,<3",
  "pre-commit>=3.8,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
phantom = "phantom.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/LICENSE",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/phantom"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "data",
  "dist",
  "models",
  "notebooks",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
ignore = [
  "E501", # The formatter handles line wrapping where it can do so safely.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["phantom"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
pretty = true
show_error_codes = true
show_error_context = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = [
  "^build/",
  "^data/",
  "^dist/",
  "^models/",
  "^notebooks/",
]

[[tool.mypy.overrides]]
module = [
  "cv2.*",
  "deepface",
  "deepface.*",
  "faster_whisper.*",
  "joblib",
  "librosa.*",
  "mediapipe.*",
  "pandas",
  "piper.*",
  "pyttsx3.*",
  "sklearn.*",
  "streamlit.*",
  "torchaudio.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = [
  "torch",
  "torch.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: exercises multiple modules or the HTTP interface",
  "optional_ml: requires the optional machine-learning dependency set",
  "safety: validates safety, privacy, or responsible-AI controls",
  "slow: takes longer than the core unit-test budget",
]

[tool.coverage.run]
branch = true
source = ["phantom"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
